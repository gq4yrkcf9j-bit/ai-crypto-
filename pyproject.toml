[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-trader"
version = "0.1.0"
description = "AI-powered autonomous crypto trading agent with Coinbase integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coinbase-advanced-py>=1.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "schedule>=1.2.0",
    "textblob>=0.18.0",
]

[project.scripts]
autotrader = "autotrader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
